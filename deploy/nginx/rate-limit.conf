# Workspace Junction: nginx rate limiting (VPS 72.61.0.11, nginx 1.24)
#
# Layer 1 of 3. nginx sheds floods cheaply; the Next.js proxy (lib/proxy-rate-limit.ts) and the NestJS API
# (backend/src/throttler-guard.ts) apply finer limits behind it.
#
# Install:
#   1. Copy PART A to /etc/nginx/conf.d/wsj-rate-limit.conf (conf.d is included inside the http {} block).
#   2. Merge the PART B location blocks into the `server_name workspacejunction.com;` 443 server in
#      /etc/nginx/sites-available/workspacejunction.com.conf, keeping the existing proxy_pass/proxy_set_header lines.
#   3. nginx -t && systemctl reload nginx
#
# Not behind Cloudflare today (DNS points straight at the VPS), so $binary_remote_addr is the real client and no
# real_ip configuration is needed. If Cloudflare is added later, configure set_real_ip_from for Cloudflare's ranges with
# real_ip_header CF-Connecting-IP first, otherwise every visitor would share Cloudflare's few edge addresses.

# ─────────────────────────────── PART A: http context ───────────────────────────────
# General traffic: 20 requests/second per IP.
limit_req_zone $binary_remote_addr zone=wsj_general:20m rate=20r/s;

# Auth and other sensitive writes: 2 requests/second per IP. GET/HEAD map to an empty key, which nginx does not
# count, so account pages that poll /api/account/auth/session are not slowed down; the API still limits them.
map $request_method $wsj_sensitive_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
}
limit_req_zone $wsj_sensitive_key zone=wsj_auth:10m rate=2r/s;

limit_req_status 429;
limit_req_log_level warn;

# ─────────────────────────────── PART B: server context ───────────────────────────────
# (inside: server { listen 443 ssl; server_name workspacejunction.com; ... })

# Static build assets and images: never limited (one page view loads dozens of them; they are cache-friendly).
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3600;
    proxy_set_header Host $host;
    expires 1y;
}
location ^~ /_next/image {
    proxy_pass http://127.0.0.1:3600;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Staff and customer authentication.
location ^~ /api/auth/ {
    limit_req zone=wsj_auth burst=5 nodelay;
    limit_req zone=wsj_general burst=40 nodelay;
    proxy_pass http://127.0.0.1:4000/api/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /api/account/auth/ {
    limit_req zone=wsj_auth burst=5 nodelay;
    limit_req zone=wsj_general burst=40 nodelay;
    proxy_pass http://127.0.0.1:4000/api/account/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Stripe webhooks: no nginx limit (deliveries are signed and must never be dropped; the API caps them at 600/min).
location ^~ /api/webhooks/ {
    proxy_pass http://127.0.0.1:4000/api/webhooks/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Existing locations: add the general limit as the first line of each.
#   location /api/ { limit_req zone=wsj_general burst=40 nodelay; ...existing lines... }
#   location /     { limit_req zone=wsj_general burst=40 nodelay; ...existing lines... }
