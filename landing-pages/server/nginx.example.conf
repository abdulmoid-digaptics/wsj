# Option A (chosen): pages under https://wp.workspacejunction.com/offers/  (matches the SEO canonical URLs)
# Add inside the existing server { } block for wp.workspacejunction.com (VPS 72.61.0.11).
# The trailing slashes strip the /offers prefix, so keep BASE_PATH empty in server/.env.
location = /offers { return 301 /offers/; }
location /offers/ {
    proxy_pass http://127.0.0.1:4310/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;    # webhook payloads
}

